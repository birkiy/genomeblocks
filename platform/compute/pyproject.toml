[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "genomeblocks-compute"
version = "0.1.0"
description = "Compute sidecar for the Genomeblocks platform — short-lived jobs invoked by the Node orchestrator."
requires-python = ">=3.11"
# Keep runtime deps narrow on purpose. Every job is a subprocess, so cold
# imports are paid per request — we only add heavier libraries (pandas,
# numpy, etc.) when a job actually needs them.
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["compute*"]
