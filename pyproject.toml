[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "genomeblocks"
version = "2.0.0"
description = "Fluent building blocks for regulatory genomics, as columnar tables."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT License"}
authors = [
    {name = "Umut Berkay Altintas"}
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics"
]
# The default install is pure pip: every default backend is here, except a
# motif engine (see the `motifs` / `lightmotif` extras; the conda package
# ships MOODS). Heavy modules are imported lazily, so `import genomeblocks`
# stays light.
dependencies = [
    "numpy",
    "pandas>=2.0",
    "pyarrow",
    "narwhals>=1.0",
    "scipy",
    "matplotlib",
    "pybigtools>=0.2",
    "cooler",
    "tqdm",
]
# NOTE: `cgranges` (fast C interval index) and `graph-tool` are conda-only and
# optional: `conda install -c bioconda cgranges` / `conda install -c conda-forge
# graph-tool`. genomeblocks' own numpy interval kernel and scipy graph backend
# are the pip defaults; the conda engines are picked up as extra backends.

[project.urls]
Homepage = "https://birkiy.github.io/genomeblocks/"
Documentation = "https://birkiy.github.io/genomeblocks/"
Repository = "https://github.com/birkiy/genomeblocks"
Issues = "https://github.com/birkiy/genomeblocks/issues"

[project.optional-dependencies]
motifs = ["MOODS-python"]               # the motif engine (C++; pip compiles it, bioconda has `moods`)
lightmotif = ["lightmotif"]             # alternative motif engine with prebuilt wheels; same hits as MOODS
fast = ["polars"]                       # polars table parsing (GTF / GFF3 / BED / pairs); pandas otherwise
bam = ["pysam"]                         # BAM pileups in the browser, FASTA via pysam
viz = ["logomaker"]                     # motif logos (genomeblocks.motifs_draw)
interop = [                             # every other engine and converter target
    "polars",
    "bioframe",
    "pyranges",
    "pybedtools",
    "anndata",
    "xarray",
    "biopython",
    "networkx",
    "igraph",
    "MOODS-python",
    "pyBigWig",
    "ncls",
    "pyfaidx",
    "pyliftover",
]
test = ["pytest", "pysam", "polars", "bioframe", "pyranges", "pybedtools", "anndata", "xarray", "biopython",
        "networkx", "igraph", "MOODS-python", "pyBigWig", "ncls", "pyfaidx", "duckdb", "seaborn", "plotly",
        "altair", "logomaker", "lightmotif"]
all = ["genomeblocks[motifs,fast,bam,viz,interop]"]

[tool.setuptools.packages.find]
include = ["genomeblocks*"]

[tool.setuptools.package-data]
"genomeblocks" = ["_view.js", "_view.css"]   # the one-file browser's assets

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
