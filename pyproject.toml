[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "genomeblocks"
version = "1.0.1"
description = "Fluent building blocks for regulatory genomics."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT License"}
authors = [
    {name = "Umut Berkay Altintas"}
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics"
]
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "matplotlib",
    "pybigtools",
    "cooler",
    "pyranges",
    "tqdm",
    "lightmotif"
]
# NOTE: `cgranges` (fast C interval index) is NOT a pip dependency — it is not
# published on PyPI. genomeblocks falls back to a pure-Python index when it is
# absent, so pip installs work; install cgranges (conda, or
# `pip install git+https://github.com/lh3/cgranges`) for the fast path.

[project.urls]
Homepage = "https://birkiy.github.io/genomeblocks/"
Documentation = "https://birkiy.github.io/genomeblocks/"
Repository = "https://github.com/birkiy/genomeblocks"
Issues = "https://github.com/birkiy/genomeblocks/issues"

[project.optional-dependencies]
test = ["pytest", "pysam"]
bam = ["pysam"]
viz = ["logomaker"]        # motif-logo plotting in genomeblocks.motifs_draw

[tool.setuptools.packages.find]
include = ["genomeblocks*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
