name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # the frozen versions are built from older commits

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true
          working-directory: docs

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      # Every entry of _data/versions.yml with a `ref` is built from that commit
      # into _site/<path>/, with the current version switcher, a banner that
      # points to the current version, and noindex.
      - name: Build the frozen versions
        env:
          JEKYLL_ENV: production
          BASE: ${{ steps.pages.outputs.base_path }}
        run: |
          ruby -ryaml -e 'YAML.load_file("_data/versions.yml").each { |v| puts [v["path"], v["version"], v["ref"]].join(" ") if v["ref"] }' |
          while read -r path version ref; do
            src="$RUNNER_TEMP/docs-$path"
            mkdir -p "$src"
            git -C "$GITHUB_WORKSPACE" archive "$ref" docs | tar -x -C "$src" --strip-components=1
            mkdir -p "$src/_includes" "$src/_data"
            cp _includes/header_custom.html "$src/_includes/"
            cp _data/versions.yml "$src/_data/"
            echo '<meta name="robots" content="noindex">' >> "$src/_includes/head_custom.html"
            printf 'docs_version: "%s"\nversion_root: "%s"\n' "$version" "$BASE" > "$src/_config_version.yml"
            bundle exec jekyll build -s "$src" -d "_site/$path" --baseurl "$BASE/$path" \
              --config "$src/_config.yml,$src/_config_version.yml"
          done

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_site/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
