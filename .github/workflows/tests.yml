name: Tests

on:
  push:
    branches: [main, v2-columnar]
    paths-ignore:
      - "docs/**"
      - "**.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**.md"
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
        extras: ["test", "test,fast,interop,bam,viz"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[${{ matrix.extras }}]"
      - name: Backends available
        run: python -c "import genomeblocks as gb; print(gb.backends().to_string())"
      - name: Test
        run: pytest -q
