<rect class="bx ghost" x="677" y="101" width="33" height="33" rx="4"></rect>
<text class="ms w" x="693" y="123" text-anchor="middle">x–y</text>
<text class="ms" x="723" y="123" text-anchor="middle">loop</text>
<text class="s" x="620" y="246">diagonal: self-contact, ~100× a loop</text>
<text class="s" x="620" y="264">pixel (H3K27ac HiChIP, 5 kb)</text>
</svg>
