<rect class="iv fp" x="680" y="104" width="27" height="27" rx="2"></rect>
<rect class="iv fpl" x="710" y="104" width="27" height="27" rx="2"></rect>
<rect class="chip" x="740" y="104" width="27" height="27" rx="2"></rect>
