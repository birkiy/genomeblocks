<svg class="gbd" viewBox="0 0 880 304" role="img" aria-label="For every track the four cells of the Fisher table come from three numbers — the query&#x27;s bins, the track&#x27;s bins and their shared count — and ref= replaces the genome in the c and d cells." xmlns="http://www.w3.org/2000/svg">
<rect class="chip white" x="20" y="20" width="250" height="24" rx="12"></rect>
<text class="m" x="145" y="36" text-anchor="middle">overlaps = M[query_bins].sum(0)[t]</text>
<text class="s" x="145" y="60" text-anchor="middle">query bins the track also covers</text>
<rect class="chip white" x="310" y="20" width="130" height="24" rx="12"></rect>
<text class="m" x="375" y="36" text-anchor="middle">n_query_bins</text>
<text class="s" x="375" y="60" text-anchor="middle">bins the query covers</text>
<polyline class="ln navy" points="145,46 145,80 174,80 174,114"/>
<polygon class="hd navy" points="174.0,118.0 170.7,111.8 177.3,111.8"/>
<polyline class="ln faint" points="375,46 375,114"/>
<polygon class="hd faint" points="375.0,118.0 371.7,111.8 378.3,111.8"/>
<rect class="chip white" x="20" y="182" width="118" height="22" rx="11"></rect>
<text class="m" x="79" y="197" text-anchor="middle">track_n_bins</text>
<text class="s" x="20" y="218">bins track t covers</text>
<polyline class="ln faint" points="140,193 144,193"/>
<polygon class="hd faint" points="148.0,193.0 141.8,196.3 141.8,189.7"/>
<rect class="chip white" x="310" y="228" width="110" height="22" rx="11"></rect>
<text class="m" x="365" y="243" text-anchor="middle">n_bins</text>
<text class="s" x="365" y="266" text-anchor="middle">bins in the genome</text>
<polyline class="ln faint" points="365,226 365,218"/>
<polygon class="hd faint" points="365.0,214.0 368.3,220.2 361.7,220.2"/>
<text class="s" x="290" y="110" text-anchor="end">in track t</text>
<text class="s" x="440" y="110" text-anchor="end">not in track t</text>
<text class="s" x="140" y="136" text-anchor="end">in query</text>
<text class="s" x="140" y="180" text-anchor="end">not in query</text>
<rect class="bx hl" x="150" y="120" width="146" height="44" rx="6"></rect>
<text class="tm" x="160" y="140">a</text>
<text class="s" x="180" y="140">=</text>
<text class="m" x="192" y="140">overlaps</text>
<text class="s" x="160" y="156">query ∩ track</text>
<rect class="bx" x="300" y="120" width="146" height="44" rx="6"></rect>
<text class="tm" x="310" y="140">b</text>
<text class="s" x="330" y="140">=</text>
<text class="m" x="342" y="140">n_query_bins − a</text>
<text class="s" x="310" y="156">query only</text>
<rect class="bx" x="150" y="168" width="146" height="44" rx="6"></rect>
<text class="tm" x="160" y="188">c</text>
<text class="s" x="180" y="188">=</text>
<text class="m" x="192" y="188">track_n_bins − a</text>
<text class="s" x="160" y="204">track only</text>
<rect class="bx" x="300" y="168" width="146" height="44" rx="6"></rect>
<text class="tm" x="310" y="188">d</text>
<text class="s" x="330" y="188">=</text>
<text class="m" x="342" y="188">n_bins − a − b − c</text>
<text class="s" x="310" y="204">neither</text>
<text class="ms" x="20" y="276">one vector per cell: every track at once (_fisher_vec)</text>
<text class="cap" x="476" y="110">FROM a, b, c, d · PER TRACK</text>
<rect class="chip navy" x="476" y="120" width="100" height="22" rx="11"></rect>
<text class="m" x="526" y="135" text-anchor="middle">log2_odds</text>
<text class="ms" x="586" y="135">log2 of (a+½)(d+½) / (b+½)(c+½)</text>
<rect class="chip navy" x="476" y="150" width="100" height="22" rx="11"></rect>
<text class="m" x="526" y="165" text-anchor="middle">p</text>
<text class="ms" x="586" y="165">hypergeometric, exact · two-sided / greater / less</text>
<rect class="chip navy" x="476" y="180" width="100" height="22" rx="11"></rect>
<text class="m" x="526" y="195" text-anchor="middle">giggle_score</text>
<text class="ms" x="586" y="195">−log10(p) · log2_odds · the sort key</text>
<text class="cap" x="476" y="214">ref= · A SECOND SET REPLACES THE GENOME IN c AND d</text>
<rect class="bx hl" x="476" y="222" width="190" height="26" rx="4"></rect>
<text class="tm" x="484" y="239">a</text>
<text class="ms" x="502" y="239">= overlaps</text>
<rect class="bx ghost" x="670" y="222" width="190" height="26" rx="4"></rect>
<text class="tm" x="678" y="239">b</text>
<text class="ms" x="696" y="239">= n_query_bins − a</text>
<rect class="bx hl" x="476" y="252" width="190" height="26" rx="4"></rect>
<text class="tm" x="484" y="269">c</text>
<text class="ms" x="502" y="269">= overlaps of ref</text>
<rect class="bx hl" x="670" y="252" width="190" height="26" rx="4"></rect>
<text class="tm" x="678" y="269">d</text>
<text class="ms" x="696" y="269">= n_ref_bins − c</text>
<text class="s" x="476" y="298">the question becomes &quot;more enriched in the query than in ref&quot;</text>
</svg>
