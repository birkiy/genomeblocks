<svg class="gbd" viewBox="0 0 880 262" role="img" aria-label="Two tables read separately carry their own Genome and codes; when they meet, Loci._check maps the right-hand names onto the left-hand codes, appends unseen names to the left Genome, and re-codes the right-hand codes column, so the engine compares integers on one Genome." xmlns="http://www.w3.org/2000/svg">
<rect class="bx green" x="20" y="20" width="236" height="150" rx="8"></rect>
<text class="tm" x="36" y="44">a</text>
<text class="s" x="56" y="44">Loci · its own Genome</text>
<rect class="chip white" x="36" y="56" width="204" height="22" rx="11"></rect>
<text class="ms" x="138" y="71" text-anchor="middle">Genome a:  chr2 → 0 · chr1 → 1</text>
<text class="s" x="36" y="100">code</text>
<text class="s" x="90" y="100">start</text>
<text class="s" x="150" y="100">end</text>
<text class="m" x="36" y="120">0</text>
<text class="m" x="90" y="120">10</text>
<text class="m" x="150" y="120">20</text>
<text class="m" x="36" y="140">1</text>
<text class="m" x="90" y="140">5</text>
<text class="m" x="150" y="140">9</text>
<text class="ms" x="200" y="120">chr2</text>
<text class="ms" x="200" y="140">chr1</text>
<rect class="bx" x="624" y="20" width="236" height="150" rx="8"></rect>
<text class="tm" x="640" y="44">b</text>
<text class="s" x="660" y="44">Loci · another Genome</text>
<rect class="chip white" x="640" y="56" width="204" height="22" rx="11"></rect>
<text class="ms" x="742" y="71" text-anchor="middle">Genome b:  chr1 → 0 · chrX → 1</text>
<text class="s" x="640" y="100">code</text>
<text class="s" x="694" y="100">start</text>
<text class="s" x="754" y="100">end</text>
<text class="m" x="640" y="120">0</text>
<text class="m" x="694" y="120">1</text>
<text class="m" x="754" y="120">6</text>
<text class="m" x="640" y="140">1</text>
<text class="m" x="694" y="140">1</text>
<text class="m" x="754" y="140">6</text>
<text class="ms" x="804" y="120">chr1</text>
<text class="ms" x="804" y="140">chrX</text>
<rect class="bx navy" x="296" y="20" width="288" height="150" rx="8"></rect>
<text class="tm" x="312" y="44">a &amp; b  →  a._check(b)</text>
<text class="m" x="312" y="66">lut[c] = a.genome._add(b.genome.names[c])</text>
<rect class="chip white" x="312" y="78" width="256" height="22" rx="11"></rect>
<text class="ms" x="440" y="93" text-anchor="middle">chr1 → 1   (already in a)</text>
<rect class="chip white" x="312" y="104" width="256" height="22" rx="11"></rect>
<text class="ms" x="440" y="119" text-anchor="middle">chrX → 2   (appended to Genome a)</text>
<text class="m" x="312" y="146">b.codes [0, 1]  →  lut[b.codes] = [1, 2]</text>
<text class="s" x="312" y="162">starts, ends, strands, cols: untouched</text>
<polyline class="ln navy" points="622,95 592,95"/>
<polygon class="hd navy" points="588.0,95.0 594.2,91.7 594.2,98.3"/>
<text class="lbl" x="605" y="84" text-anchor="middle">names</text>
<polyline class="ln navy" points="294,60 262,60"/>
<polygon class="hd navy" points="258.0,60.0 264.2,56.7 264.2,63.3"/>
<text class="lbl" x="276" y="50" text-anchor="middle">codes</text>
<rect class="bx green" x="20" y="190" width="236" height="50" rx="8"></rect>
<text class="s" x="36" y="210">Genome a, after</text>
<text class="m" x="36" y="228">chr2 → 0 · chr1 → 1 · chrX → 2</text>
<polyline class="ln green" points="60,172 60,184"/>
<polygon class="hd green" points="60.0,188.0 56.7,181.8 63.3,181.8"/>
<rect class="bx green" x="296" y="190" width="288" height="50" rx="8"></rect>
<text class="s" x="312" y="210">b′ = b on a&#x27;s Genome, same rows</text>
<text class="m" x="312" y="228">codes [1, 2] · starts [1, 1] · ends [6, 6]</text>
<polyline class="ln navy" points="440,172 440,184"/>
<polygon class="hd navy" points="440.0,188.0 436.7,181.8 443.3,181.8"/>
<rect class="bx" x="624" y="190" width="236" height="50" rx="8"></rect>
<text class="s" x="640" y="210">overlap_pairs(a, b′) on integer codes</text>
<text class="m" x="640" y="228">a &amp; b → a[[1]]: chr1 [5, 9) meets [1, 6)</text>
<polyline class="ln green" points="586,215 618,215"/>
<polygon class="hd green" points="622.0,215.0 615.8,218.3 615.8,211.7"/>
</svg>
