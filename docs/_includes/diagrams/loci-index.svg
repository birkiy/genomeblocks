<text class="lbl" x="340.8" y="286" text-anchor="middle">only these starts are tested: keep the ones with end &gt; qs</text>
<rect class="iv fg" x="536" y="25" width="18" height="10" rx="2"></rect>
<text class="s" x="560" y="34">overlaps the query</text>
