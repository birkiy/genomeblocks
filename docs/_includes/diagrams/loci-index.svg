<rect class="iv fl" x="699.6" y="66" width="62.4" height="12" rx="2"><title>[820, 900)</title></rect>
<polyline class="ln faint" points="130.2,140 130.2,146 356.4,146 356.4,140"/>
<text class="s" x="243.3" y="160" text-anchor="middle">longest interval = max_len</text>
<polyline class="ln faint" points="60,200 840,200"/>
<text class="s" x="60" y="190">sorted starts</text>
<circle class="dot muted" cx="91.2" cy="200" r="4.5"/>
<circle class="dot muted" cx="130.2" cy="200" r="4.5"/>
<circle class="dot muted" cx="177" cy="200" r="4.5"/>
