<circle class="dot navy" cx="294" cy="200" r="4.5"/>
<circle class="dot navy" cx="340.8" cy="200" r="4.5"/>
<circle class="dot navy" cx="395.4" cy="200" r="4.5"/>
<circle class="dot navy" cx="450" cy="200" r="4.5"/>
<circle class="dot muted" cx="520.2" cy="200" r="4.5"/>
<circle class="dot muted" cx="567" cy="200" r="4.5"/>
<circle class="dot muted" cx="621.6" cy="200" r="4.5"/>
<circle class="dot muted" cx="699.6" cy="200" r="4.5"/>
<polyline class="ln navy" points="200.4,244 200.4,214"/>
<polygon class="hd navy" points="200.4,210.0 203.7,216.2 197.1,216.2"/>
