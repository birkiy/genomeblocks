<text class="s" x="450" y="113" text-anchor="middle">no</text>
<text class="m" x="550" y="113" text-anchor="middle">0 / 3 / 2</text>
<text class="s" x="620" y="113">+19–27% contact; partner CREs inflate</text>
<text class="t" x="20" y="146">each pixel once per CRE</text>
<text class="ms" x="20" y="160">a node rule</text>
