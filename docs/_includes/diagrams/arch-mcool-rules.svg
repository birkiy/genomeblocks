<rect class="bx warn" x="424" y="61" width="52" height="20" rx="10"></rect>
<text class="s" x="450" y="75" text-anchor="middle">no</text>
<text class="m" x="550" y="75" text-anchor="middle">76 / 43 / 171</text>
<text class="s" x="620" y="75">closed CREs in a bin take equal shares</text>
<text class="t" x="20" y="108">no split</text>
<text class="ms" x="20" y="122">full count per edge</text>
