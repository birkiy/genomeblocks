<svg class="gbd" viewBox="0 0 880 330" role="img" aria-label="Seven ways to give a pixel&#x27;s count to the edges in it, scored on contact conservation, dilution by CREs without a peak, self-contact pixels, and the super-hubs three T-cell states lose between their own and a union graph." xmlns="http://www.w3.org/2000/svg">
<text class="cap" x="20" y="30">RULE</text>
<text class="cap" x="270" y="24" text-anchor="middle">CONSERVES</text>
<text class="cap" x="270" y="38" text-anchor="middle">CONTACT</text>
<text class="cap" x="360" y="24" text-anchor="middle">NO DILUTION</text>
<text class="cap" x="360" y="38" text-anchor="middle">BY CLOSED CRES</text>
<text class="cap" x="450" y="24" text-anchor="middle">NO SELF-</text>
<text class="cap" x="450" y="38" text-anchor="middle">CONTACT</text>
<text class="cap" x="550" y="24" text-anchor="middle">HUBS LOST</text>
