<text class="s" x="450" y="151" text-anchor="middle">no</text>
<text class="m" x="550" y="151" text-anchor="middle">68 / 51 / 0</text>
<text class="s" x="620" y="151">+9–13%; one bin&#x27;s CREs counted twice</text>
<text class="t" x="20" y="184">centre binning</text>
