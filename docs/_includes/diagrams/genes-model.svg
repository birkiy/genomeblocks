<svg class="gbd" viewBox="0 0 880 318" role="img" aria-label="Genes.make reads GTF lines into three row-aligned tables: genes, transcripts (gene = the gene&#x27;s row) and features (kind, transcript = the transcript&#x27;s row); every table is a Loci with 0-based starts, so start − 1 is applied once while parsing." xmlns="http://www.w3.org/2000/svg">
