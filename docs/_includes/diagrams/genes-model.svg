<text class="ms w2" x="146" y="108">chr8  127735434  +</text>
<text class="m w" x="304" y="108" text-anchor="end">T1 #1</text>
<text class="m w" x="36" y="128">five_prime_UTR</text>
<text class="ms w2" x="146" y="128">chr8  127735434  +</text>
<text class="m w" x="304" y="128" text-anchor="end">T1</text>
<text class="m w" x="36" y="148">CDS</text>
<text class="ms w2" x="146" y="148">chr8  127736231  +</text>
<text class="m w" x="304" y="148" text-anchor="end">T1</text>
<text class="m w" x="36" y="168">exon</text>
<text class="ms w2" x="146" y="168">chr8  127740396  +</text>
<text class="m w" x="304" y="168" text-anchor="end">T1 #2</text>
<text class="m w" x="36" y="188">transcript</text>
<text class="ms w2" x="146" y="188">chr8  127736623  +</text>
<text class="m w" x="304" y="188" text-anchor="end">T2</text>
<text class="m w" x="36" y="208">exon</text>
<text class="ms w2" x="146" y="208">chr8  127736623  +</text>
<text class="m w" x="304" y="208" text-anchor="end">T2 #1</text>
<text class="m w" x="36" y="228">…</text>
<text class="ms w2" x="146" y="228"></text>
<text class="m w" x="304" y="228" text-anchor="end"></text>
