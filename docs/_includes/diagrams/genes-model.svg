<text class="m w" x="304" y="68" text-anchor="end">MYC</text>
<text class="m w" x="36" y="88">transcript</text>
<text class="ms w2" x="146" y="88">chr8  127735434  +</text>
<text class="m w" x="304" y="88" text-anchor="end">T1</text>
