<text class="cap" x="654" y="22">OUT · CONVERTERS · PROTOCOLS</text>
<rect class="chip white" x="654" y="34" width="206" height="22" rx="11"></rect>
<text class="ms" x="757" y="49" text-anchor="middle">to_pandas · to_polars · to_arrow</text>
<rect class="chip white" x="654" y="61" width="206" height="22" rx="11"></rect>
<text class="ms" x="757" y="76" text-anchor="middle">to_bioframe · to_pyranges · to_bedtool</text>
<rect class="chip white" x="654" y="88" width="206" height="22" rx="11"></rect>
<text class="ms" x="757" y="103" text-anchor="middle">to_cgranges · to_anndata · to_records</text>
<rect class="chip white" x="654" y="115" width="206" height="22" rx="11"></rect>
<text class="ms" x="757" y="130" text-anchor="middle">to_numpy · to_bed · save (parquet)</text>
<text class="s" x="654" y="157">protocols, no conversion:</text>
<rect class="chip white" x="654" y="169" width="206" height="22" rx="11"></rect>
<text class="ms" x="757" y="184" text-anchor="middle">__arrow_c_stream__ → polars · DuckDB</text>
<rect class="chip white" x="654" y="196" width="206" height="22" rx="11"></rect>
<text class="ms" x="757" y="211" text-anchor="middle">__dataframe__ → seaborn · pandas</text>
<rect class="chip white" x="654" y="223" width="206" height="22" rx="11"></rect>
<text class="ms" x="757" y="238" text-anchor="middle">__narwhals_dataframe__ → altair · plotly</text>
<text class="s" x="20" y="270">every public function calls as_loci on its inputs: signal(peaks_df) · genes.annotations(&#x27;peaks.bed&#x27;) · Architecture.make(cre, loops_df)</text>
</svg>
