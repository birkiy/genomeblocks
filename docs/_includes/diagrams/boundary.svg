<text class="m" x="556" y="193" text-anchor="middle">Atlas</text>
<text class="s" x="556" y="218" text-anchor="middle">built from Loci:</text>
<text class="s" x="556" y="232" text-anchor="middle">same codes, same rows</text>
<polyline class="ln navy" points="626,140 648,140"/>
