<svg class="gbd" viewBox="0 0 880 282" role="img" aria-label="Every input kind enters through one function, as_loci, which finds the columns by name and builds the numpy columns of a Loci on one Genome; the other tables are built from Loci, and every container leaves through explicit to_* converters or the Arrow, interchange and narwhals protocols." xmlns="http://www.w3.org/2000/svg">
