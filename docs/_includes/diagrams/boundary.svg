<rect class="chip white" x="20" y="223" width="210" height="22" rx="11"></rect>
<text class="ms" x="125" y="238" text-anchor="middle">__arrow_c_stream__ · __dataframe__</text>
<polyline class="ln faint" points="232,234 254,234"/>
<polygon class="hd faint" points="258.0,234.0 251.8,237.3 251.8,230.7"/>
<rect class="bx green" x="260" y="34" width="196" height="211" rx="8"></rect>
<text class="tm" x="358" y="60" text-anchor="middle">as_loci(x)</text>
<text class="s" x="358" y="80" text-anchor="middle">the one boundary</text>
<text class="s" x="358" y="112" text-anchor="middle">columns found by name:</text>
<text class="ms" x="358" y="130" text-anchor="middle">chrom · chr · Chromosome …</text>
<text class="ms" x="358" y="148" text-anchor="middle">start · Start · chromStart …</text>
<text class="s" x="358" y="166" text-anchor="middle">names → codes, one Genome</text>
<text class="s" x="358" y="184" text-anchor="middle">int64 starts and ends</text>
<text class="s" x="358" y="202" text-anchor="middle">rows kept in input order</text>
<text class="s" x="358" y="232" text-anchor="middle">no type branching inside</text>
<polyline class="ln green" points="458,140 482,140"/>
