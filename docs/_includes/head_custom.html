<!-- Genomeblocks brand fonts (Nunito @font-face rules need Liquid for baseurl) -->
<link rel="stylesheet" href="{{ '/assets/css/brand-fonts.css' | relative_url }}">

<!-- Varela Round for code blocks -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Varela+Round&display=swap" rel="stylesheet">

<!-- Mobile browser chrome color matches brand navy -->
<meta name="theme-color" content="#003552">

<!-- Move search from top bar to bottom of sidebar -->
<script>
document.addEventListener('DOMContentLoaded', function () {
  var search = document.querySelector('.main-header .search');
  var sidebar = document.querySelector('.side-bar');
  if (search && sidebar) { sidebar.appendChild(search); }
});
</script>

<!-- Small og:image so WhatsApp/Telegram show compact thumbnail-left layout -->
<meta property="og:image" content="{{ '/assets/images/logo-preview.png' | absolute_url }}">
<meta property="og:image:width" content="200">
<meta property="og:image:height" content="200">
