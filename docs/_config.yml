title: genomeblocks
description: Fluent building blocks for regulatory genomics in Python.
remote_theme: just-the-docs/just-the-docs

# Source + build
markdown: kramdown
kramdown:
  syntax_highlighter: rouge
  input: GFM
  hard_wrap: false

# just-the-docs settings
color_scheme: light
search_enabled: true
search:
  heading_level: 3
  previews: 2
  preview_words_before: 3
  preview_words_after: 3
  tokenizer_separator: /[\s/]+/
  rel_url: true
  button: false

heading_anchors: true

aux_links:
  "GitHub":
    - "https://github.com/birkiy/genomeblocks"
  "PyPI":
    - "https://pypi.org/project/genomeblocks/"

nav_external_links:
  - title: GitHub repo
    url: https://github.com/birkiy/genomeblocks
    hide_icon: false

# Footer
footer_content: "Copyright &copy; 2024–2026 Umut Berkay Altintas. MIT Licensed."

# Collections / permalinks
permalink: pretty

# Exclude files from the build
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - .bundle

plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag
  - jekyll-sitemap

# Callouts
callouts_level: quiet
callouts:
  note:
    title: Note
    color: blue
  warning:
    title: Warning
    color: yellow
  tip:
    title: Tip
    color: green
