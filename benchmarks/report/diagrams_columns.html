<!-- @wrappers -->
<svg viewBox="0 0 760 250" role="img" aria-label="pandas, polars, Arrow and the proposed genomeblocks Loci all keep data as columns. They differ in what they wrap around the columns: pandas adds a row index and general table tools, Arrow is a standard layout that polars and DuckDB read without copying, and genomeblocks would add an interval index, genomic methods and Locus views. Converting between them can reuse the same memory.">
  <defs>
    <marker id="cl3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker>
  </defs>
  <rect x="290" y="96" width="180" height="62" rx="8" class="box hl"/>
  <text x="380" y="120" text-anchor="middle" class="head">column arrays</text>
  <text x="380" y="138" text-anchor="middle" class="small">start · end · chrom · …</text>
  <text x="380" y="152" text-anchor="middle" class="small">the same idea in all four</text>
  <rect x="20" y="20" width="230" height="78" rx="8" class="box"/>
  <text x="32" y="42" class="head">pandas DataFrame</text>
  <text x="32" y="60" class="small">+ row index and column labels</text>
  <text x="32" y="75" class="small">+ general table tools (groupby, join…)</text>
  <text x="32" y="90" class="small">one row at a time: 14–49 µs</text>
  <rect x="20" y="156" width="230" height="78" rx="8" class="box"/>
  <text x="32" y="178" class="head">Arrow / polars</text>
  <text x="32" y="196" class="small">+ a standard memory layout shared</text>
  <text x="32" y="211" class="small">by polars, DuckDB, Spark, R arrow</text>
  <text x="32" y="226" class="small">one row at a time: 1.1–1.5 µs</text>
  <rect x="510" y="86" width="230" height="84" rx="8" class="box hl"/>
  <text x="522" y="108" class="head">genomeblocks Loci (proposed)</text>
  <text x="522" y="126" class="small">+ interval index (cgranges)</text>
  <text x="522" y="141" class="small">+ genomic methods (&amp;, merge, signal…)</text>
  <text x="522" y="156" class="small">+ Locus views: one row ≈ 1 µs</text>
  <line x1="250" y1="66" x2="288" y2="104" class="arrow" marker-end="url(#cl3)"/>

  <line x1="470" y1="127" x2="508" y2="127" class="arrow hl" marker-end="url(#cl3)"/>
  <text x="380" y="190" text-anchor="middle" class="small">hand-over between them</text>
  <text x="380" y="205" text-anchor="middle" class="small">reuses the arrays (≤ 1 ms per 100k peaks)</text>
</svg>
